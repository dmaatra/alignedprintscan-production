<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>APS Manual Screenshot Fixtures</title>
  <style>
    :root{--nav:#191d4b;--nav2:#272d65;--gold:#d5bc70;--ink:#17203a;--muted:#667085;--bg:#f6f4ef;--card:#fff;--line:#ded9cd;--good:#237a57;--warn:#9a6416;--danger:#9f3030}
    *{box-sizing:border-box} body{margin:0;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
    .shell{width:663px;min-height:900px;display:grid;grid-template-columns:178px 485px}.side{background:var(--nav);color:#fff;padding:22px 13px}.brand{font-family:Georgia,serif;font-size:18px;color:#f0dc9a;margin-bottom:24px}.side small{display:block;color:#9ca3c8;letter-spacing:.11em;margin:17px 7px 7px}.side div{padding:9px 10px;border-radius:10px;margin:3px 0}.side .on{background:var(--nav2);border-left:3px solid var(--gold)}
    main{min-width:0;padding:20px 18px 34px}.fixture{display:inline-flex;gap:6px;align-items:center;background:#fff3cd;border:1px solid #e5ca73;color:#6d5300;font-weight:800;letter-spacing:.055em;padding:6px 9px;border-radius:999px;font-size:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:start;margin:13px 0 16px}.top h1{font:700 25px Georgia,serif;margin:0 0 4px}.ref{color:var(--muted);font-size:13px}.top>.pill{display:none}
    .tabs{display:flex;gap:1px;overflow:hidden;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs span{padding:8px 7px;font-size:11px;white-space:nowrap}.tabs .on{font-weight:800;border-bottom:3px solid var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}.card{min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 8px #1018280a}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}
    h2{font:700 19px Georgia,serif;margin:0 0 10px} h3{font-size:13px;letter-spacing:.06em;margin:0 0 10px;color:#6b5a26} p{margin:4px 0;overflow-wrap:anywhere}.muted{color:var(--muted)}.money{font-size:25px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.row>*{min-width:0;overflow-wrap:anywhere}.row:last-child{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0f8;font-size:10px;font-weight:800}.pill.good{background:#e7f5ee;color:var(--good)}.pill.warn{background:#fff3dc;color:var(--warn)}.pill.red{background:#fdebea;color:var(--danger)}
    button{border:0;border-radius:9px;padding:9px 11px;background:var(--nav);color:white;font-weight:800;font-size:12px}button.gold{background:var(--gold);color:#262038}button.out{background:white;color:var(--nav);border:1px solid var(--nav)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
    label{display:block;font-size:12px;font-weight:750;margin:8px 0 4px}.input{border:1px solid #cfd2da;background:white;border-radius:8px;padding:8px 9px;min-height:36px;overflow-wrap:anywhere}.textarea{min-height:66px}.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.step{padding:8px 5px;text-align:center;border:1px solid #d9dce5;border-radius:9px;font-size:9px}.step.done{background:#e7f5ee;border-color:#9bcbb7}.step.now{background:#fff2c5;border-color:#d6b655;font-weight:800}.note{border-left:4px solid var(--gold);padding:9px 11px;background:#fffaf0;margin-top:10px;overflow-wrap:anywhere}.portal .side{background:#faf7ef;color:var(--ink);border-right:1px solid var(--line)}.portal .brand{color:var(--nav)}.portal .side .on{background:#ebe7d8;border-left-color:var(--gold)}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7e4dc}th{color:#666;font-size:12px;letter-spacing:.05em}.check{display:flex;gap:9px;align-items:center;margin:9px 0}.box{width:17px;height:17px;border:1px solid #aab0bd;border-radius:4px}.box.on{background:var(--good);box-shadow:inset 0 0 0 4px white}
    @media(max-width:700px){.span4{grid-column:span 4}}
  </style>
</head>
<body><div id="app"></div>
<script>
const tabs=`<div class="tabs"><span>Overview</span><span>Customer</span><span>Documents</span><span>Quote</span><span>Payments</span><span>Messages</span><span>Fulfillment</span><span>Timeline</span></div>`;
const adminSide=(active)=>`<aside class="side"><div class="brand">ALIGNED<br>PRINT &amp; SCAN</div><small>OPERATIONS</small>${['Requests','Review Queue','Calendar','RON Sessions'].map(x=>`<div class="${x===active?'on':''}">${x}</div>`).join('')}<small>FINANCIAL</small><div>Invoices</div><div>Payments</div><small>COMMUNICATIONS</small><div>Messages</div><div>Templates</div></aside>`;
const headingBlock=(title,sub)=>`<div class="fixture">APS MANUAL TEST · SYNTHETIC DOCUMENTATION FIXTURE</div><div class="top"><div><h1>${title}</h1><div class="ref">${sub}</div></div><span class="pill">TRAINING VIEW</span></div>`;
const admin=(active,title,sub,body,activeTab='')=>`<div class="shell">${adminSide(active)}<main>${headingBlock(title,sub)}${activeTab?tabs.replace(`<span>${activeTab}</span>`,`<span class="on">${activeTab}</span>`):''}${body}</main></div>`;
const portal=(title,sub,body,active='Overview')=>`<div class="shell portal"><aside class="side"><div class="brand">MY REQUEST</div>${['Overview','Documents','Quote & Payment','Appointment / Fulfillment','Messages','Activity'].map(x=>`<div class="${x===active?'on':''}">${x}</div>`).join('')}</aside><main>${headingBlock(title,sub)}${body}</main></div>`;
const fixtures={
'SS-001':admin('Requests','Requests','Synthetic service mix · current production navigation',`<div class="grid"><section class="card span12"><h3>REQUEST FILTERS</h3><div class="row"><span>Search: APS MANUAL TEST</span><span>All services ▾ &nbsp; All statuses ▾</span></div></section>${[['APS-MANUAL-RON','Remote Online Notary','Appointment Confirmed'],['APS-MANUAL-MOBILE','Mobile Notary','Payment Received'],['APS-MANUAL-PRINT','Print & Scan','Completed']].map((r,i)=>`<section class="card span4"><span class="pill ${i===2?'good':'warn'}">${r[2]}</span><h2 style="margin-top:12px">${r[0]}</h2><p>APS MANUAL TEST ${r[1]}</p><p class="muted">${r[1]}</p></section>`).join('')}`),
'SS-010':admin('Review Queue','Review Queue','Actionable synthetic operations only',`<div class="grid"><section class="card span12"><div class="row"><div><span class="pill red">HIGH PRIORITY</span><h2 style="margin-top:10px">Cancellation and refund review</h2><p>APS-MANUAL-CANCEL · Mobile Notary</p><p class="muted">Customer-requested cancellation · waiting 18 minutes</p></div><div><button>Review Request</button></div></div><div class="note">Open the exact request and review service progress, payments, policy band, and customer reason before deciding.</div></section></div>`),
'SS-031':admin('Requests','Private Deliverable Awaiting Review','APS-MANUAL-DOCUMENT · Print & Scan',`<div class="grid"><section class="card span12"><h3>DOCUMENTS</h3><div class="row"><div><h2>APS_MANUAL_SAMPLE_DOCUMENT.pdf</h2><p>APS Deliverable · Admin Upload · Customer-hidden</p></div><span class="pill warn">PENDING APS REVIEW</span></div><div class="note">Private by default. Review is required before this file can become release eligible.</div><div class="actions"><button>Review Document</button><button class="out">Keep Private</button></div></section></div>`,'Documents'),
'SS-032':admin('Requests','Reviewed Deliverable Ready for Release','APS-MANUAL-DOCUMENT · Print & Scan',`<div class="grid"><section class="card span12"><h3>DOCUMENTS</h3><div class="row"><div><h2>APS_MANUAL_SAMPLE_DOCUMENT.pdf</h2><p>APS Deliverable · Reviewed · Customer-hidden</p></div><span class="pill good">RELEASE ELIGIBLE</span></div><div class="note">Review is complete. Release remains a separate explicit customer-visible action.</div><div class="actions"><button class="gold">Release to Customer</button><button class="out">Keep Private</button></div></section></div>`,'Documents'),
'SS-040':admin('Requests','Saved Synthetic Quote','APS-MANUAL-QUOTE · Print & Scan',`<div class="grid"><section class="card span8"><h3>FULL SERVICE QUOTE BUILDER</h3><div class="row"><span>Printing / Copies — B&amp;W Letter</span><b>$10.00</b></div><div class="row"><span>Scanning</span><b>$15.00</b></div><div class="row"><span>PDF Merge / Organization</span><b>$5.00</b></div><div class="actions"><button>Add Line Item</button><button class="gold">Save Quote</button></div></section><section class="card span4"><h3>QUOTE STATE</h3><span class="pill good">SAVED</span><p class="money">$30.00</p><p class="muted">Saving does not send the quote.</p><button class="out">Preview Customer Quote</button></section></div>`,'Quote'),
'SS-050':admin('Requests','Synthetic Invoice and TEST Payment','APS-MANUAL-PAYMENT · No real money',`<div class="grid"><section class="card span8"><h3>INVOICE</h3><div class="row"><span>INV-MANUAL-01</span><span class="pill good">PAID</span></div><div class="row"><span>Invoice total</span><b>$40.00</b></div><div class="row"><span>TEST manual payment</span><b>$40.00</b></div><div class="actions"><button>Record Primary Payment</button><button class="out">Create Additional Invoice</button></div></section><section class="card span4"><h3>FINANCIAL SUMMARY</h3><div class="row"><span>Paid</span><b>$40.00</b></div><div class="row"><span>Refunded</span><b>$0.00</b></div><div class="row"><span>Net retained</span><b>$40.00</b></div><div class="row"><span>Outstanding</span><b>$0.00</b></div></section></div>`,'Payments'),
'SS-052':admin('Review Queue','Guided Cancellation and Refund Review','APS-MANUAL-CANCEL · Synthetic payment only',`<div class="grid"><section class="card span7"><h3>CANCELLATION REVIEW</h3><div class="row"><span>Service</span><b>Mobile Notary</b></div><div class="row"><span>Policy band</span><b>Before travel / no work performed</b></div><div class="row"><span>Customer reason</span><b>Plans changed</b></div><div class="row"><span>Work / fulfillment</span><b>Not started</b></div><label>Private waiver reason</label><div class="input">APS MANUAL TEST — documentation fixture</div></section><section class="card span5"><h3>FINANCIAL PREVIEW</h3><div class="row"><span>Amount paid</span><b>$40.00</b></div><div class="row"><span>Earned / retained</span><b>$10.00</b></div><div class="row"><span>Refundable</span><b>$30.00</b></div><div class="check"><span class="box"></span> Waive cancellation fee</div><label>Refund method</label><div class="input">Manual TEST refund — no real money</div><div class="actions"><button>Approve Cancellation</button><button class="out">Decline Request</button></div></section></div>`),
'SS-060':admin('Requests','Communication Log','APS-MANUAL-MESSAGES · Synthetic history',`<div class="grid"><section class="card span12"><h3>COMMUNICATION LOG</h3><table><thead><tr><th>Direction</th><th>Template / Subject</th><th>Delivery</th><th>Sent</th></tr></thead><tbody><tr><td>Outbound</td><td>Request Received · APS MANUAL TEST</td><td><span class="pill good">Sent</span></td><td>Aug 15 · 10:12 AM</td></tr><tr><td>Outbound</td><td>Quote Ready · APS MANUAL TEST</td><td><span class="pill good">Sent</span></td><td>Aug 15 · 10:18 AM</td></tr><tr><td>Outbound</td><td>Payment Received · APS MANUAL TEST</td><td><span class="pill good">Sent</span></td><td>Aug 15 · 10:24 AM</td></tr></tbody></table><div class="note">Messages is the delivery record. Timeline is not a substitute.</div></section></div>`,'Messages'),
'SS-061':admin('Requests','Send Message','APS-MANUAL-MESSAGES · Preview only',`<div class="grid"><section class="card span7"><h3>MESSAGE COMPOSER</h3><label>Template</label><div class="input">General Message</div><label>Recipient</label><div class="input">Controlled owner/test recipient</div><label>Subject</label><div class="input">Information about APS MANUAL TEST</div><label>Body</label><div class="input textarea">This is a synthetic documentation preview. No message is being sent.</div><label>Attachments</label><div class="input">No attachments</div><div class="actions"><button>Send Message</button></div></section><section class="card span5"><h3>PREVIEW</h3><p><b>Aligned Print &amp; Scan</b></p><p>Information about APS MANUAL TEST</p><p class="muted">Informational sends do not change authoritative request status.</p></section></div>`,'Messages'),
'SS-062':admin('Requests','Send & Update Status','APS-MANUAL-TRANSITION · Preview only',`<div class="grid"><section class="card span7"><h3>MESSAGE COMPOSER</h3><label>Template</label><div class="input">Quote Ready</div><label>Current status</label><div class="input">Under Review</div><label>Status after successful send</label><div class="input">Quote Ready</div><label>Subject</label><div class="input">Your APS MANUAL TEST quote is ready</div><div class="actions"><button class="gold">Send &amp; Update Status</button><button class="out">Send Message</button></div></section><section class="card span5"><h3>TRANSITION RULE</h3><div class="note">Delivery succeeds first. APS then applies the maintained status transition and records Messages plus Timeline.</div></section></div>`,'Messages'),
'SS-070':admin('RON Sessions','RON Fulfillment and Proof Handoff','APS-D9C172CD · Controlled synthetic request',`<div class="grid"><section class="card span12"><h3>13-STAGE RON WORKFLOW</h3><div class="steps">${['Business Ready','Proof Draft','Signers','Documents','Review & Activate','Signer Access','Invitation Viewed','Live Notarization','Proof Complete','Document Return','APS Review','Customer Release','APS Complete'].map((s,i)=>`<div class="step ${i<7?'done':i===7?'now':''}">${i+1}<br>${s}</div>`).join('')}</div></section><section class="card span7"><h3>CURRENT / NEXT</h3><p><span class="pill warn">CURRENT</span> Live Notarization — Proof-native identity and session boundary</p><p><span class="pill">NEXT</span> Wait for authoritative Proof completion and completed asset</p><div class="note">No KBA, identity, signing, certificate, or seal information belongs in APS.</div></section><section class="card span5"><h3>OPERATOR HANDOFF</h3><div class="actions"><button>Continue in Proof ↗</button><button class="out">Sync Proof Status</button></div><p class="muted">Provider transaction identifiers and access links are intentionally omitted.</p></section></div>`,'Fulfillment'),
'SS-080':admin('Requests','Mobile Notary Fulfillment','APS-035B3880 · Synthetic completed request',`<div class="grid"><section class="card span6"><h3>APPOINTMENT</h3><div class="row"><span>Date / time</span><b>Aug 16 · 1:00 PM</b></div><div class="row"><span>Method</span><b>Mobile appointment</b></div><div class="row"><span>Location</span><b>Synthetic training location</b></div><div class="row"><span>Service performed</span><span class="pill good">YES</span></div></section><section class="card span6"><h3>AUTHORITATIVE FULFILLMENT FACTS</h3><div class="check"><span class="box on"></span> Mobile component purchased</div><div class="check"><span class="box on"></span> Mobile service performed</div><div class="row"><span>Participant readiness</span><b>Prepared and ready</b></div><div class="row"><span>Document readiness</span><b>Reviewed and ready</b></div><div class="row"><span>Delivery path</span><b>Physical-only; no portal deliverable</b></div></section><section class="card span12"><h3>COMPLETION GATE</h3><span class="pill good">ALL APPLICABLE MOBILE BLOCKERS CLEARED</span><p class="muted">Proof controls, courier pickup, and portal deliverable are N/A for this physical-only service.</p></section></div>`,'Fulfillment'),
'SS-100':portal('APS MANUAL TEST Request','Synthetic customer portal · access URL intentionally excluded',`<div class="grid"><section class="card span8"><h3>NEXT ACTION</h3><h2>Your appointment is confirmed</h2><p>Review your service details and prepare the requested documents.</p><button>View Appointment / Fulfillment</button></section><section class="card span4"><h3>REQUEST SUMMARY</h3><div class="row"><span>Service</span><b>Mobile Notary</b></div><div class="row"><span>Status</span><span class="pill good">Appointment Confirmed</span></div><div class="row"><span>Balance</span><b>$0.00</b></div></section></div>`),
'SS-101':portal('Documents','APS MANUAL TEST · Synthetic released deliverables',`<div class="grid"><section class="card span4"><h3>DOCUMENTS YOU PROVIDED</h3><p><b>APS_TEST_SOURCE.pdf</b></p><p class="muted">Customer-provided source</p></section><section class="card span4"><h3>DOCUMENTS FROM ALIGNED PRINT &amp; SCAN</h3><p><b>APS_MANUAL_SAMPLE_DOCUMENT.pdf</b></p><span class="pill good">Released</span></section><section class="card span4"><h3>COMPLETED NOTARIZED DOCUMENTS</h3><p class="muted">None yet. A synthetic APS deliverable is not labeled as a notarized Proof result.</p></section></div>`,'Documents'),
'SS-110':portal('Request Cancellation','APS MANUAL TEST · Synthetic request',`<div class="grid"><section class="card span8"><h3>REQUEST CANCELLATION</h3><p>Submit a request for APS review. This does not automatically cancel service or issue a refund.</p><label>Reason</label><div class="input">Plans changed</div><label>Additional details</label><div class="input textarea">Synthetic documentation example.</div><div class="actions"><button>Submit Cancellation Request</button><button class="out">Keep Request</button></div></section><section class="card span4"><h3>WHAT HAPPENS NEXT</h3><p>APS reviews service progress, policy timing, and applicable payment history.</p><div class="note">Submitting once creates a review item; it does not promise a specific refund.</div></section></div>`,'Overview'),
'SS-112':portal('Refund Status','APS MANUAL TEST · Synthetic manual ledger; no real money',`<div class="grid"><section class="card span7"><h3>PAYMENT HISTORY</h3><div class="row"><span>Original TEST payment</span><b>$40.00</b></div><div class="row"><span>Synthetic refund</span><b>−$30.00</b></div><p class="muted">The original payment remains in history. The refund is a separate linked record.</p></section><section class="card span5"><h3>FINANCIAL OUTCOME</h3><div class="row"><span>Paid</span><b>$40.00</b></div><div class="row"><span>Refunded</span><b>$30.00</b></div><div class="row"><span>Net retained</span><b>$10.00</b></div><div class="row"><span>Outstanding</span><b>$0.00</b></div><span class="pill good">REFUND PROCESSED — TEST</span></section></div>`,'Quote & Payment')
};
const id=new URLSearchParams(location.search).get('id')||'SS-001';document.getElementById('app').innerHTML=fixtures[id]||fixtures['SS-001'];document.title=`${id} · APS Manual Fixture`;
</script></body></html>
